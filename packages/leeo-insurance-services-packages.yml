generated: '2026-07-19'
method: searched
source: https://docs.leeoinsurance.com/
notes: >-
  LEEO was formerly Fairmatic and rebranded in December 2025. First-party client libraries are
  published under BOTH brands: the mature, widely-versioned Fairmatic SDK line (npm/Maven/NuGet/
  CocoaPods git podspec/SPM, v3.x) and a newer Leeo-branded line (npm + CocoaPods trunk, v0.1.1).
  The Leeo-branded packages are confirmed first-party by their CocoaPods trunk owner
  chaim.wiesner@leeoinsurance.com and the npm `leeoinsurance` maintainer account. These are mobile
  telematics SDKs (trip tracking, insurance-period marking, incident reporting) — LEEO publishes no
  server-side client library for the REST Fleet Telematics API.
