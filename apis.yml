aid: leeo-insurance-services
name: LEEO Insurance Services
description: >-
  LEEO Insurance Services is a San Francisco-based managing general agent (MGA) for commercial auto
  insurance, founded in 2017 and known as Fairmatic until its December 2025 rebrand. LEEO
  underwrites and prices fleet policies using telematics collected from drivers' phones through its
  mobile SDK, applying machine learning across underwriting, pricing, and claims, and rewarding
  safer driving with renewal credits and cashback. It writes fleet classes including non-emergency
  medical transport, light business auto, and last-mile delivery, selling through brokers. LEEO
  exposes a read-only REST Fleet Telematics API returning the driver roster, trip histories, trip
  paths and driving events, and daily and weekly driver safety scorecards, plus native SDKs for
  Android, iOS, React Native, and MAUI. The company has raised $91M and is backed by Battery
  Ventures, Foundation Capital, and Aquiline Technology Growth.
